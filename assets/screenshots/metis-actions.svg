<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-label="From suggestion to confirmed change architecture diagram"><rect width="1440" height="960" fill="#111b23"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#edf3ef}.small{font-size:22px;fill:#a9bdc4}.label{font-size:22px;letter-spacing:3px;fill:#d4f27a}.title{font-size:56px;font-weight:600}.box{fill:#192a35;stroke:#36505b;stroke-width:2}.node{font-size:29px;font-weight:600}.copy{font-size:22px;fill:#b5c7ce}</style><text x="80" y="75" class="label">DEVILISHDAGON / PROJECT ARCHITECTURE</text><text x="80" y="160" class="title">From suggestion to confirmed change</text><text x="80" y="211" class="small">A conversation is the start of a workflow, not blanket permission</text><rect x="80.0" y="280" width="406.6666666666667" height="185" rx="16" class="box"/><rect x="80.0" y="280" width="5" height="185" fill="#d4f27a"/><text x="105.0" y="333" class="node">01 · Understand</text><text x="105.0" y="380" class="copy">Read the relevant record</text><text x="105.0" y="416" class="copy">Retain its source and revision</text><rect x="516.6666666666667" y="280" width="406.6666666666667" height="185" rx="16" class="box"/><rect x="516.6666666666667" y="280" width="5" height="185" fill="#d4f27a"/><text x="541.6666666666667" y="333" class="node">02 · Propose</text><text x="541.6666666666667" y="380" class="copy">Prepare the exact change</text><text x="541.6666666666667" y="416" class="copy">Keep original evidence</text><rect x="953.3333333333334" y="280" width="406.6666666666667" height="185" rx="16" class="box"/><rect x="953.3333333333334" y="280" width="5" height="185" fill="#d4f27a"/><text x="978.3333333333334" y="333" class="node">03 · Review</text><text x="978.3333333333334" y="380" class="copy">The owner confirms or rejects</text><text x="978.3333333333334" y="416" class="copy">Calendar and project edits</text><rect x="80.0" y="510" width="625.0" height="185" rx="16" class="box"/><rect x="80.0" y="510" width="5" height="185" fill="#d4f27a"/><text x="105.0" y="563" class="node">04 · Apply safely</text><text x="105.0" y="610" class="copy">Durable request identity</text><text x="105.0" y="646" class="copy">Stale-record checks</text><rect x="735.0" y="510" width="625.0" height="185" rx="16" class="box"/><rect x="735.0" y="510" width="5" height="185" fill="#d4f27a"/><text x="760.0" y="563" class="node">05 · Report honestly</text><text x="760.0" y="610" class="copy">Confirmed, queued or failed</text><text x="760.0" y="646" class="copy">Undo respects later changes</text><line x1="80" x2="1360" y1="795" y2="795" stroke="#36505b"/><text x="80" y="843" class="small">Offline changes stay visibly unconfirmed until acknowledged by the service.</text><text x="80" y="894" class="label">SOURCE REVIEW · 27 OCT 2026 · DIAGRAM, NOT AN APP SCREENSHOT</text></svg>